name: pdf_toolkit
description: A powerful cross-platform PDF manipulation toolkit for Windows and Android.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # PDF Processing
  pdf: ^3.10.7
  printing: ^5.11.1
  syncfusion_flutter_pdf: ^24.1.41

  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  open_file: ^3.3.2

  # UI Components
  flutter_dropzone: ^3.0.7
  desktop_drop: ^0.4.4
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0

  # Icons & Theme
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Utils
  path: ^1.8.3
  intl: ^0.18.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Note: Poppins font is loaded via google_fonts package
  # No custom font assets needed
